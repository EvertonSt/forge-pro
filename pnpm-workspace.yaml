packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency build scripts by default. esbuild's postinstall
# is required to place its platform binary; sharp needs its binary too.
# Keep this allowlist tight — add entries only when an install fails on a
# trusted package.
allowBuilds:
  # The desktop shell: electron's postinstall downloads the runtime binary,
  # and electron-winstaller builds the NSIS installer.
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm 11's release-age gate flags packages published within the last N days.
minimumReleaseAgeExclude:
  - astro@7.2.0
