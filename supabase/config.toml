# Forge Pro — Supabase local config.
# Reference: https://supabase.com/docs/guides/local-development
# After `supabase init` (creates config.toml), `supabase start` boots Postgres
# + Auth + Storage locally and applies supabase/migrations/*.sql.

project_id = "forge-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
